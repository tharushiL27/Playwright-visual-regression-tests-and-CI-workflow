name: Playwright Visual Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers & System Dependencies
      run: npx playwright install --with-deps

    - name: Generate Linux Visual Baselines
      run: npx playwright test visual.spec.ts --update-snapshots

    - name: Commit Linux Snapshots
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests/visual.spec.ts-snapshots/*-linux.png
        git diff --staged --quiet || git commit -m "Add Linux visual test baselines"
        git push

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30